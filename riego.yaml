title: Riego Inteligente
views:
  # ===========================================================================
  # VISTA 1 — Panel general: etapas, válvulas y clima
  # ===========================================================================
  - title: General
    path: general
    icon: mdi:watering-can
    cards:
      - type: markdown
        content: |
          ## 🌿 Riego inteligente — 2 circuitos
          Monitor en tiempo real de etapas, válvulas y condiciones climáticas.

      - type: markdown
        title: Reintentos nocturnos (ola de calor)
        content: |
          **Ciclos alternados** Zona 1 ↔ Zona 2 cada ~35 min (ajustable).
          Al **inicio de cada ciclo** se lee la humedad:
          - Si está seca → riega y reinicia confirmaciones.
          - Si está bien → suma 1 confirmación.
          - Tras **2 lecturas OK** seguidas (ajustable) → marca zona hecha hoy.
          - Confirmación exige humedad a **≤ 5 pts** del objetivo (no confundir con umbral de riego: 15 pts).
          Ciclos 6–8 = ventana fallback ola de calor.

      - type: horizontal-stack
        cards:
          - type: entity
            entity: input_select.riego_zona1_etapa
            name: Zona 1 — etapa
            icon: mdi:sprout
          - type: markdown
            content: >
              **Zona 1 — próximo paso**
              {% set id = 'sensor.riego_zona_1_decision_prevista' %}
              {% if states(id) in ['unknown', 'unavailable'] %}
              {% set id = 'sensor.riego_zona1_decision_prevista' %}
              {% endif %}
              {{ states(id) }}

      - type: horizontal-stack
        cards:
          - type: entity
            entity: input_select.riego_zona2_etapa
            name: Zona 2 — etapa
            icon: mdi:flower
          - type: markdown
            content: >
              **Zona 2 — próximo paso**
              {% set id = 'sensor.riego_zona_2_decision_prevista' %}
              {% if states(id) in ['unknown', 'unavailable'] %}
              {% set id = 'sensor.riego_zona2_decision_prevista' %}
              {% endif %}
              {{ states(id) }}

      - type: markdown
        title: Progreso Zona 1
        content: >
          **Próximo ciclo:** {% set dp = 'sensor.riego_zona_1_decision_prevista' %}{% if states(dp) in ['unknown', 'unavailable'] %}{% set dp = 'sensor.riego_zona1_decision_prevista' %}{% endif %}{{ states(dp) }}
          (foco {{ state_attr(dp, 'cultivo_foco') }},
          {{ state_attr(dp, 'humedades') }},
          amanecer {{ state_attr(dp, 'margen_amanecer') }})
          {% set e = states('input_select.riego_zona1_etapa') %}
          {% set pasos = [
            'Iniciando',
            'Pulso 1 — regando',
            'Pausa absorción',
            'Pulso 2 — refuerzo',
            'Lectura final',
            'Completado'
          ] %}
          **Detalle:** {% set ed = 'sensor.riego_zona_1_etapa_detalle' %}{% if states(ed) in ['unknown', 'unavailable'] %}{% set ed = 'sensor.riego_zona1_etapa_detalle' %}{% endif %}{% if states(ed) in ['unknown', 'unavailable'] %}{{ states('input_select.riego_zona1_etapa') }}{% else %}{{ states(ed) }}{% endif %}
          {% for p in pasos %}
          {{ '✅' if e == p else ('⏳' if e == 'En espera' and loop.first else '⬜') }} {{ p }}
          {% endfor %}
          {% if e == 'Pulso suave — regando' %}
          💧 **Pulso suave** — humedad intermedia ({{ states('input_number.riego_pulso_suave_min') | int }} min).
          {% endif %}
          {% if e == 'Confirmando humedad' %}
          💧 **Humedad OK** — esperando otra lectura al inicio del próximo ciclo para cerrar la zona.
          {% endif %}
          {% if e == 'En espera — sensor no disponible' %}
          📡 **Sensor Mi Flora no disponible** — reintento cuando vuelva Bluetooth.
          {% endif %}
          {% if e == 'En espera — suelo caliente' %}
          🌡️ **Suelo caliente** — esperando a que baje de 28 °C o al fallback de las 4 h.
          {% endif %}
          {% if e == 'En espera — encharque / EC baja' %}
          🧪 **Encharque + EC baja** — no se riega (suelo húmedo con pocos nutrientes).
          {% endif %}
          {% if e == 'Ola de calor — riego nocturno' %}
          🌡️ **Ola de calor** — suelo caliente pero humedad baja; riego nocturno activado.
          {% endif %}
          {% if e == 'No necesario — suelo húmedo' %}
          ℹ️ **No regó hoy** — humedad suficiente en todos los cultivos.
          {% endif %}

      - type: markdown
        title: Progreso Zona 2
        content: >
          **Próximo ciclo:** {% set dp = 'sensor.riego_zona_2_decision_prevista' %}{% if states(dp) in ['unknown', 'unavailable'] %}{% set dp = 'sensor.riego_zona2_decision_prevista' %}{% endif %}{{ states(dp) }}
          (Tex {{ state_attr(dp, 'humedad_tex') }},
          amanecer {{ state_attr(dp, 'margen_amanecer') }})
          {% set e = states('input_select.riego_zona2_etapa') %}
          {% set pasos = [
            'Iniciando',
            'Pulso 1 — regando',
            'Pausa absorción',
            'Pulso 2 — refuerzo',
            'Lectura final',
            'Completado'
          ] %}
          **Detalle:** {% set ed = 'sensor.riego_zona_2_etapa_detalle' %}{% if states(ed) in ['unknown', 'unavailable'] %}{% set ed = 'sensor.riego_zona2_etapa_detalle' %}{% endif %}{% if states(ed) in ['unknown', 'unavailable'] %}{{ states('input_select.riego_zona2_etapa') }}{% else %}{{ states(ed) }}{% endif %}
          {% for p in pasos %}
          {{ '✅' if e == p else '⬜' }} {{ p }}
          {% endfor %}
          {% if e == 'Pulso suave — regando' %}
          💧 **Pulso suave** — humedad intermedia ({{ states('input_number.riego_pulso_suave_min') | int }} min).
          {% endif %}
          {% if e == 'Confirmando humedad' %}
          💧 **Humedad OK** — esperando otra lectura al inicio del próximo ciclo para cerrar la zona.
          {% endif %}
          {% if e == 'En espera — sensor no disponible' %}
          📡 **Sensor Mi Flora no disponible** — reintento cuando vuelva Bluetooth.
          {% endif %}
          {% if e == 'En espera — suelo caliente' %}
          🌡️ **Suelo caliente** — esperando a que baje de 28 °C o al fallback de las 4 h.
          {% endif %}
          {% if e == 'En espera — encharque / EC baja' %}
          🧪 **Encharque + EC baja** — no se riega (suelo húmedo con pocos nutrientes).
          {% endif %}
          {% if e == 'Ola de calor — riego nocturno' %}
          🌡️ **Ola de calor** — suelo caliente pero humedad baja; riego nocturno activado.
          {% endif %}
          {% if e == 'No necesario — suelo húmedo' %}
          ℹ️ **No regó hoy** — Tex con humedad suficiente.
          {% endif %}

      - type: glance
        title: Válvulas y clima
        show_name: true
        entities:
          - entity: switch.valvula_riego_huerto
            name: Válvula Huerto
          - entity: switch.valvula_riego_rosales_pera
            name: Válvula Jardín
          - entity: sensor.riego_clima_permitido
            name: Riego permitido
          - entity: weather.aemet
            name: Tiempo AEMET
          - entity: sensor.riego_zona_1_temp_suelo_max
            name: Temp. suelo Zona 1
          - entity: sensor.riego_zona_2_temp_suelo
            name: Temp. suelo Zona 2
          - entity: sensor.riego_zona_1_sensores_ok
            name: Sensores OK Zona 1
          - entity: sensor.riego_zona_2_sensores_ok
            name: Sensores OK Zona 2
          - entity: sensor.aemet_rain
            name: Lluvia prevista

      - type: entities
        title: Últimas ejecuciones
        entities:
          - entity: input_datetime.riego_zona1_ultimo
            name: Último riego Zona 1
          - entity: input_datetime.riego_zona2_ultimo
            name: Último riego Zona 2
          - entity: input_boolean.riego_zona1_hecho_hoy
            name: Zona 1 hecha hoy
          - entity: input_boolean.riego_zona2_hecho_hoy
            name: Zona 2 hecha hoy
          - entity: input_boolean.riego_noche_en_curso
            name: Orquestador nocturno activo
          - entity: input_boolean.riego_activo
            name: Riego automático activo
          - entity: sensor.riego_zona_1_estado
            name: Estado Zona 1
          - entity: sensor.riego_zona_2_estado
            name: Estado Zona 2
          - entity: sensor.riego_configuracion_ok
            name: Configuración OK
          - entity: input_select.riego_turno_ciclo
            name: Turno ciclo
          - entity: input_number.riego_zona1_confirmaciones_humedad
            name: Confirmaciones Z1
          - entity: input_number.riego_zona2_confirmaciones_humedad
            name: Confirmaciones Z2
          - entity: input_select.riego_zona1_etapa
            name: Etapa Zona 1
          - entity: input_select.riego_zona2_etapa
            name: Etapa Zona 2
          - entity: sensor.riego_zona_1_desbalance
            name: Desbalance circuito huerto
          - entity: sensor.riego_minutos_hasta_amanecer
            name: Minutos hasta amanecer
          - entity: sensor.riego_zona_1_bloqueo_ec
            name: Bloqueo EC Z1
          - entity: sensor.riego_zona_2_bloqueo_ec
            name: Bloqueo EC Z2

      - type: history-graph
        title: Minutos hasta amanecer — 24 h
        hours_to_show: 24
        refresh_interval: 120
        entities:
          - entity: sensor.riego_minutos_hasta_amanecer
            name: Margen nocturno
          - entity: input_number.riego_minutos_margen_amanecer
            name: Umbral margen (ref.)

      - type: history-graph
        title: Confirmaciones y regados — 48 h
        hours_to_show: 48
        refresh_interval: 120
        entities:
          - entity: input_number.riego_zona1_confirmaciones_humedad
            name: Confirmaciones Z1
          - entity: input_number.riego_zona2_confirmaciones_humedad
            name: Confirmaciones Z2
          - entity: input_number.riego_zona2_regados_noche
            name: Regados Z2 / noche
          - entity: input_number.riego_zona1_ciclos_sin_progreso
            name: Sin progreso Z1
          - entity: input_number.riego_zona2_ciclos_sin_progreso
            name: Sin progreso Z2

  # ===========================================================================
  # VISTA 2 — Cultivos: humedad actual vs objetivo
  # ===========================================================================
  - title: Cultivos
    path: cultivos
    icon: mdi:sprout
    cards:
      - type: markdown
        content: |
          **Desfase** = objetivo − humedad actual (positivo = necesita más agua).
          Ajusta goteros según alertas, no la válvula general.

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.jardin_1_cherry_humedad
            name: Cherry
            min: 0
            max: 60
            severity:
              green: 30
              yellow: 20
              red: 0
          - type: entity
            entity: sensor.riego_cherry_desfase
            name: Desfase Cherry

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.jardin_2_motto_humedad
            name: Pepinos
            min: 0
            max: 60
            severity:
              green: 35
              yellow: 25
              red: 0
          - type: entity
            entity: sensor.riego_motto_desfase
            name: Desfase Pepinos

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.jardin_4_escu_humedad
            name: Calabazas
            min: 0
            max: 60
            severity:
              green: 28
              yellow: 20
              red: 0
          - type: entity
            entity: sensor.riego_escu_desfase
            name: Desfase Calabazas

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.jardin_3_tex_humedad
            name: Tomates Pera
            min: 0
            max: 60
            severity:
              green: 30
              yellow: 20
              red: 0
          - type: entity
            entity: sensor.riego_tex_desfase
            name: Desfase Tex

      - type: markdown
        title: Refuerzo Zona 1 (jardineras/arriate)
        content: >
          Pulsos fijos **sin evaluar desbalance**. Complementan el orquestador nocturno.
          Las horas son en punto (p. ej. slider **7** → 07:00, **19** → 19:00).
          Actual: **{{ states('input_number.riego_zona1_pulso_programado_min') | int(2) }} min**
          a las **{{ states('input_number.riego_zona1_refuerzo_hora_manana') | int(7) }}:00**
          y **{{ states('input_number.riego_zona1_refuerzo_hora_tarde') | int(19) }}:00**.
      - type: entities
        title: Ajuste refuerzo Z1
        show_header_toggle: false
        entities:
          - entity: input_number.riego_zona1_pulso_programado_min
            name: Minutos de refuerzo
          - entity: input_number.riego_zona1_refuerzo_hora_manana
            name: Hora mañana
          - entity: input_number.riego_zona1_refuerzo_hora_tarde
            name: Hora tarde
          - entity: script.riego_programado_zona1
            name: Lanzar refuerzo ahora
          - entity: sensor.riego_efectivo_pulso_programado_z1_min
            name: Duración efectiva (min/s sim)

      - type: entities
        title: Objetivos de humedad (ajustables)
        entities:
          - input_number.riego_objetivo_cherry
          - input_number.riego_objetivo_motto
          - input_number.riego_objetivo_escu
          - input_number.riego_objetivo_tex
          - input_number.riego_umbral_desfase_moderado
          - input_number.riego_umbral_desfase_grave
          - input_number.riego_ciclos_para_hecho
          - input_number.riego_pausa_entre_ciclos
          - input_number.riego_max_ciclos_noche
          - input_number.riego_umbral_confirmacion
          - input_number.riego_umbral_regar
          - input_number.riego_umbral_pulso2
          - input_number.riego_umbral_temperatura_suelo
          - input_number.riego_pulso1_minutos
          - input_number.riego_pausa_absorcion_min
          - input_number.riego_pulso2_zona1_min
          - input_number.riego_pulso2_zona2_min
          - input_number.riego_pulso_suave_min
          - input_number.riego_pausa_suave_min
          - input_number.riego_lectura_final_min
          - input_number.riego_umbral_desbalance_circuito
      - type: markdown
        title: Prueba manual — aviso
        content: >
          {% if is_state('input_boolean.riego_noche_en_curso', 'on') %}
          ⚠️ **Orquestador nocturno activo** — lanzar un ciclo manual puede solaparse con el turno automático y alterar contadores. Preferible esperar o desactivar el orquestador.
          {% elif is_state('input_boolean.riego_zona1_ciclo_en_curso', 'on') or is_state('input_boolean.riego_zona2_ciclo_en_curso', 'on') %}
          ⏳ **Hay un ciclo en ejecución** — espera a que termine antes de lanzar otro.
          {% else %}
          ✅ Puedes lanzar un ciclo de prueba. Revisa **decisión prevista** en la pestaña General.
          {% endif %}
          {% if is_state('input_boolean.riego_modo_simulacion', 'on') %}
          
          🧪 **Simulación activa** — tiempos cortos automáticos (sin tocar los sliders):
          pulso 1, pausa, pulso 2, lectura y pulso suave **1 min → 1 s**;
          pausa entre ciclos del orquestador **2 min → 2 s**; válvulas cerradas.
          {% endif %}

      - type: entities
        title: Prueba manual (un ciclo)
        entities:
          - script.riego_ciclo_zona1
          - script.riego_ciclo_zona2
          - script.riego_test_logica
          - script.riego_recuperar_estado
      - type: markdown
        title: Orquestador nocturno (prueba)
        content: >
          {% if is_state('sun.sun', 'below_horizon') %}
          🌙 **De noche** — puedes lanzar el orquestador alternado (Z1↔Z2) con el botón de abajo.
          {% else %}
          ☀️ **De día** el orquestador no ejecuta ciclos (solo entre atardecer y amanecer).
          Usa un ciclo suelto Z1/Z2 arriba o espera al atardecer +15 min (automático).
          {% endif %}
          Tras reiniciar HA hay que relanzarlo a mano si ya pasó el atardecer.
      - type: entities
        title: Lanzar orquestador
        entities:
          - script.riego_noche_alternada
          - input_boolean.riego_noche_en_curso
          - input_select.riego_turno_ciclo
      - type: entities
        title: Control maestro
        entities:
          - input_boolean.riego_activo
          - input_boolean.riego_modo_simulacion
          - input_boolean.riego_zona1_ciclo_en_curso
          - input_boolean.riego_zona2_ciclo_en_curso
          - input_text.riego_zona1_cultivo_seco_inicio
          - input_boolean.riego_forzar_pese_clima
          - input_number.riego_zona1_ciclos_sin_progreso
          - input_number.riego_zona2_ciclos_sin_progreso
          - input_number.riego_umbral_ec_encharque
          - input_number.riego_minutos_margen_amanecer

      - type: entities
        title: Mi Flora — lecturas completas
        entities:
          - group.mi_flora_cherry
          - group.mi_flora_motto
          - group.mi_flora_escu
          - group.mi_flora_tex

  # ===========================================================================
  # VISTA 3 — Histórico de mediciones (7 días)
  # ===========================================================================
  - title: Histórico
    path: historico
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Humedad — 7 días
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.jardin_1_cherry_humedad
            name: Cherry
          - entity: sensor.jardin_2_motto_humedad
            name: Pepinos
          - entity: sensor.jardin_3_tex_humedad
            name: Tex
          - entity: sensor.jardin_4_escu_humedad
            name: Calabazas

      - type: history-graph
        title: Temperatura suelo — 7 días
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.jardin_1_cherry_temperatura
            name: Cherry
          - entity: sensor.jardin_2_motto_temperatura
            name: Pepinos
          - entity: sensor.jardin_3_tex_temperatura
            name: Tex
          - entity: sensor.jardin_4_escu_temperatura
            name: Calabazas

      - type: history-graph
        title: Conductividad — 7 días
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.jardin_1_cherry_conductividad
            name: Cherry
          - entity: sensor.jardin_2_motto_conductividad
            name: Pepinos
          - entity: sensor.jardin_3_tex_conductividad
            name: Tex
          - entity: sensor.jardin_4_escu_conductividad
            name: Calabazas

      - type: history-graph
        title: Iluminancia — 7 días
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.jardin_1_cherry_iluminancia
            name: Cherry
          - entity: sensor.jardin_2_motto_iluminancia
            name: Pepinos
          - entity: sensor.jardin_3_tex_iluminancia
            name: Tex
          - entity: sensor.jardin_4_escu_iluminancia
            name: Calabazas

      - type: history-graph
        title: Etapas de riego — 48 h
        hours_to_show: 48
        refresh_interval: 60
        entities:
          - entity: input_select.riego_zona1_etapa
            name: Zona 1
          - entity: input_select.riego_zona2_etapa
            name: Zona 2
          - entity: switch.valvula_riego_huerto
            name: Válvula Huerto
          - entity: switch.valvula_riego_rosales_pera
            name: Válvula Jardín

  # ===========================================================================
  # VISTA 4 — Alertas y avisos
  # ===========================================================================
  - title: Alertas
    path: alertas
    icon: mdi:bell-alert
    cards:
      - type: entity
        entity: input_text.riego_ultima_alerta
        name: Última alerta
        icon: mdi:bell-ring

      - type: entity
        entity: input_datetime.riego_ultima_alerta_hora
        name: Hora de la última alerta

      - type: markdown
        title: Historial decisiones (ciclos)
        content: >
          {% set h = states('input_text.riego_historial_decisiones') %}
          {% set h2 = states('input_text.riego_historial_decisiones_b') %}
          {% if h in ['', 'unknown', 'unavailable'] and h2 in ['', 'unknown', 'unavailable'] %}
          Sin decisiones registradas aún.
          {% else %}
          {{ (h ~ '\n\n' ~ h2) | replace('\\n', '\n\n') }}
          {% endif %}

      - type: markdown
        title: Historial reciente
        content: >
          {% set h = states('input_text.riego_historial_alertas') %}
          {% set h2 = states('input_text.riego_historial_alertas_b') %}
          {% if h in ['', 'unknown', 'unavailable'] and h2 in ['', 'unknown', 'unavailable'] %}
          Sin alertas registradas aún.
          {% else %}
          {{ (h ~ '\n\n' ~ h2) | replace('\\n', '\n\n') }}
          {% endif %}

      - type: markdown
        title: Estado actual por cultivo
        content: >
          {% set cultivos = [
            ('Cherry', 'sensor.riego_cherry_desfase'),
            ('Pepinos', 'sensor.riego_motto_desfase'),
            ('Calabazas', 'sensor.riego_escu_desfase'),
            ('Tomates Pera', 'sensor.riego_tex_desfase')
          ] %}
          {% for nombre, sensor in cultivos %}
          {% set nivel = state_attr(sensor, 'nivel') %}
          {% set icon = '⚪' if nivel == 'desconocido' else ('🔴' if nivel == 'grave' else ('🟠' if nivel == 'moderado' else ('🟡' if nivel == 'leve' else '🟢'))) %}
          {{ icon }} **{{ nombre }}**: desfase {{ states(sensor) }} pts ({{ nivel }})
          {% endfor %}

      - type: logbook
        title: Registro de automatizaciones
        hours_to_show: 168
        entities:
          - automation.riego_orquestador_nocturno
          - automation.riego_reset_contadores_post_noche
          - automation.riego_aviso_valvula_manual_en_noche
          - automation.riego_aviso_bluetooth_sensores_caidos
          - automation.alerta_configuracion_riego_incoherente
          - automation.alerta_desbalance_goteros_zona_1
          - automation.alerta_desfase_grave_humedad_por_cultivo
          - automation.alerta_nutrientes_conductividad
          - automation.alerta_bateria_baja_mi_flora

      - type: entities
        title: Batería Mi Flora
        entities:
          - sensor.jardin_1_cherry_bateria
          - sensor.jardin_2_motto_bateria
          - sensor.jardin_3_tex_bateria
          - sensor.jardin_4_escu_bateria

      - type: entities
        title: Automatizaciones (activar/desactivar)
        entities:
          - automation.riego_orquestador_nocturno
          - automation.riego_cerrar_valvulas_al_arrancar
          - automation.riego_reset_diario
          - automation.riego_reset_contadores_post_noche
          - automation.riego_aviso_valvula_manual_en_noche
          - automation.riego_aviso_bluetooth_sensores_caidos
          - automation.alerta_configuracion_riego_incoherente
          - automation.alerta_desbalance_goteros_zona_1
          - automation.alerta_desfase_grave_humedad_por_cultivo
          - automation.alerta_nutrientes_conductividad
          - automation.alerta_bateria_baja_mi_flora

      - type: markdown
        title: Última ejecución
        content: >
          «Nunca» en Ajustes solo indica que **aún no se cumplieron** las condiciones del disparador.
          **Reset diario** (amanecer) y **Seguridad al arrancar** (reinicio HA) son las que más suelen ejecutarse.
          El **orquestador nocturno** solo corre al atardecer +15 min si: riego activo, clima OK,
          `sensor.riego_configuracion_ok` = ok, ninguna zona hecha hoy y orquestador no en curso.

  # ===========================================================================
  # VISTA 5 — Calibración de goteros (guía de partida)
  # ===========================================================================
  - title: Goteros
    path: goteros
    icon: mdi:water-pump
    cards:
      - type: markdown
        content: |
          ## 💧 Calibración de goteros
          Guía de partida para goteros regulables **rueda 0–60** (escala habitual **0–6,0 L/h**;
          cada marca ≈ **0,1 L/h**). Estrategia: **caudales bajos + varios ciclos** hasta humedad OK.

      - type: markdown
        title: Información de partida
        content: |
          ### Cómo funciona el riego
          - **2 válvulas**, varios cultivos por circuito → el caudal se regula **solo en cada gotero**.
          - Pulsos cortos: **10 min** (+ refuerzo 5–8 min si sigue seco).
          - **Ciclos alternados** Z1 ↔ Z2 cada ~35 min; hasta **8 ciclos** por noche.
          - La zona se cierra tras **2 lecturas OK** seguidas (sensor tarda en estabilizarse).

          ### Fórmula — agua por pulso de 10 min
          `Litros = Caudal (L/h) × 10 ÷ 60 = Caudal ÷ 6`

          | Caudal | Marca rueda | L en 10 min | L ciclo máx. Z1* |
          |--------|-------------|-------------|------------------|
          | 1,5 L/h | 15 | 0,25 L | ~0,70 L |
          | 2,0 L/h | 20 | 0,33 L | ~0,93 L |
          | 2,5 L/h | 25 | 0,42 L | ~1,17 L |
          | 3,0 L/h | 30 | 0,50 L | ~1,40 L |
          | 3,5 L/h | 35 | 0,58 L | ~1,63 L |
          | 4,0 L/h | 40 | 0,67 L | ~1,87 L |

          \* Zona 1: hasta 10 + 8 min si sigue seco (18 min máx. por ciclo).

          **Objetivo por pulso:** subir humedad **~4–8 puntos** en el Mi Flora.
          Si sube **&lt; 4 pts** → gotero muy cerrado. Si **&gt; 12 pts** → demasiado abierto.

          > Si en la prueba de 10 min sale el **doble** del rango esperado, tu escala puede ser 0–60 L/h real
          > (poco habitual en macetas) → usa **~1/10** del giro indicado.

      - type: markdown
        title: Configuración inicial por cultivo
        content: |
          | Cultivo | Soporte | Obj. HA | Caudal | Marca | Giro desde cerrado* |
          |---------|---------|---------|--------|-------|---------------------|
          | **Cherry** | Jardineras | 35 % | 1,8–2,2 L/h | **18–22** | ~**1/3** vuelta |
          | **Pepinos** | Arriate | 42 % | 3,0–3,5 L/h | **30–35** | ~**1/2** vuelta |
          | **Calabazas** | Arriate | 32 % | 2,5–3,0 L/h | **25–30** | ~**2/5** vuelta |
          | **Tomates Pera** | Cajón madera | 35 % | 2,8–3,2 L/h | **28–32** | ~**1/2** vuelta |
          | **Rosales** | Zona 2 (sin sensor) | — | 2,0–2,5 L/h | **20–25** | ~**1/3** vuelta |

          \* 1 vuelta completa = escala 0→60. Si tu gotero necesita 2 vueltas para abrir del todo, divide entre 2.

          **Pepinos &gt; Calabazas** en la rueda porque el objetivo de humedad es mayor (42 % vs 32 %),
          aunque compartan válvula en Zona 1.

      - type: markdown
        title: Prueba de calibración (10 min)
        content: |
          Antes del primer riego automático, **por cada gotero**:

          1. Cierra la rueda del todo (**0**).
          2. Abre hasta la **marca de partida** (tabla siguiente).
          3. Abre la válvula **solo 10 min** con vaso graduado bajo el gotero.
          4. Comprueba mililitros medidos:

          | Cultivo | Marca partida | Rango esperado (10 min) |
          |---------|---------------|-------------------------|
          | Cherry | **20** | 280–380 ml |
          | Pepinos | **32** | 480–580 ml |
          | Calabazas | **28** | 400–500 ml |
          | Tomates Pera | **30** | 450–530 ml |
          | Rosales | **22** | 320–420 ml |

          Ajusta la rueda hasta entrar en el rango antes de confiar en el riego nocturno.

      - type: markdown
        title: Ajuste — primeras 2 semanas
        content: |
          El sistema te avisará por notificación. Usa esta tabla como referencia rápida:

          | Señal del sistema | Acción en la rueda |
          |-------------------|-------------------|
          | Subida **&lt; 4 pts** tras regar | Abrir **~1/4 vuelta** o revisar obstrucción |
          | Desfase **≥ 8 pts** (moderado) | Abrir **~1/4 vuelta** |
          | Desfase **≥ 15 pts** (grave) | Abrir **~1/2 vuelta** |
          | **&gt; 12 pts** por encima del objetivo | Cerrar **~1/4 vuelta** (encharque) |
          | Desbalance Z1 **&gt; 18 %** entre cultivos | Subir gotero del **más seco**, bajar del **más húmedo** |

          **Umbrales del sistema** (pestaña Cultivos): confirmación **5 pts**, riego completo **15 pts**, pulso suave entre ambos (5 min).

          | Desfase | Acción |
          |---------|--------|
          | ≤ 5 pts | Confirmación de humedad |
          | 6–14 pts | **Pulso suave** (poca agua) |
          | ≥ 15 pts | Riego completo (pulsos largos) |

          **Reglas de oro**
          - No alargues el tiempo de válvula para un solo cultivo → ajusta **su gotero**.
          - Tras **2 ciclos**, si un cultivo sigue seco y otro ya está bien en el mismo circuito,
            abre **solo** el gotero del seco.
          - Si un cultivo siempre queda seco tras varios días, sube su `objetivo` 2–3 pts en la pestaña **Cultivos**.
          - Clava el Mi Flora cerca de raíces; el goteo no debe caer sobre la cabeza del sensor.

      - type: markdown
        title: Resumen práctico
        content: |
          | Cultivo | Zona | Marca inicial | Giro aprox. |
          |---------|------|---------------|-------------|
          | Cherry | 1 | **20** | 1/3 |
          | Pepinos | 1 | **32** | 1/2 |
          | Calabazas | 1 | **28** | 2/5 |
          | Tomates Pera | 2 | **30** | 1/2 |
          | Rosales | 2 | **22** | 1/3 |

          El orquestador repetirá ciclos hasta confirmar humedad; **no hace falta** llegar al objetivo en un solo ciclo.

      - type: markdown
        title: Estado actual (para calibrar)
        content: >
          {% set cultivos = [
            ('Cherry', 'sensor.riego_cherry_desfase', 'sensor.jardin_1_cherry_humedad', 'input_number.riego_objetivo_cherry', '20'),
            ('Pepinos', 'sensor.riego_motto_desfase', 'sensor.jardin_2_motto_humedad', 'input_number.riego_objetivo_motto', '32'),
            ('Calabazas', 'sensor.riego_escu_desfase', 'sensor.jardin_4_escu_humedad', 'input_number.riego_objetivo_escu', '28'),
            ('Tomates Pera', 'sensor.riego_tex_desfase', 'sensor.jardin_3_tex_humedad', 'input_number.riego_objetivo_tex', '30')
          ] %}
          {% for nombre, desfase, humedad, objetivo, marca in cultivos %}
          {% set nivel = state_attr(desfase, 'nivel') %}
          {% set icon = '⚪' if nivel == 'desconocido' else ('🔴' if nivel == 'grave' else ('🟠' if nivel == 'moderado' else ('🟡' if nivel == 'leve' else '🟢'))) %}
          {{ icon }} **{{ nombre }}** — {{ states(humedad) }}% (obj. {{ states(objetivo) }}%, desfase {{ states(desfase) }} pts) · marca partida **{{ marca }}**
          {% endfor %}

          🌹 **Rosales** — sin sensor; marca partida **22**, revisar a ojo cuando avise Zona 2.

      - type: markdown
        title: Bloqueo encharque / EC baja
        content: >
          {% if is_state('sensor.riego_zona_1_bloqueo_ec', 'si') %}
          🧪 **Zona 1 — riego bloqueado:** {{ state_attr('sensor.riego_zona_1_bloqueo_ec', 'cultivos') }}
          {% else %}
          ✅ Zona 1 — sin bloqueo EC.
          {% endif %}
          {% if is_state('sensor.riego_zona_2_bloqueo_ec', 'si') %}
          🧪 **Zona 2 — riego bloqueado:** {{ state_attr('sensor.riego_zona_2_bloqueo_ec', 'cultivos') }}
          {% else %}
          ✅ Zona 2 — sin bloqueo EC.
          {% endif %}
          Umbral EC: {{ states('input_number.riego_umbral_ec_encharque') }} µS/cm · encharque = humedad &gt; objetivo + {{ states('input_number.riego_umbral_confirmacion') | int }} pts.

      - type: markdown
        title: Progreso de calibración
        content: >
          {% set sp1 = states('input_number.riego_zona1_ciclos_sin_progreso') | int(0) %}
          {% set sp2 = states('input_number.riego_zona2_ciclos_sin_progreso') | int(0) %}
          {% set ca1 = 'on' if is_state('input_boolean.riego_alerta_caudal_z1_enviada', 'on') else 'off' %}
          {% set ca2 = 'on' if is_state('input_boolean.riego_alerta_caudal_z2_enviada', 'on') else 'off' %}
          **Zona 1** — ciclos sin subir humedad: **{{ sp1 }}**/3
          {{ '⚠️ revisar gotero' if sp1 >= 2 else '✅ OK' }} · alerta caudal hoy: {{ ca1 }}.
          **Zona 2** — ciclos sin progreso: **{{ sp2 }}**/3
          {{ '⚠️ revisar gotero' if sp2 >= 2 else '✅ OK' }} · alerta caudal hoy: {{ ca2 }}.
          Objetivo: subir **≥4 pts** tras cada pulso; el sistema avisa si **&lt;3 pts** tras regar.

      - type: entities
        title: Umbrales de alerta (ajustables)
        entities:
          - input_number.riego_umbral_desfase_moderado
          - input_number.riego_umbral_desfase_grave
          - input_number.
  