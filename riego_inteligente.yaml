  riego_umbral_ec_encharque:
    name: EC mínima si encharcado (µS/cm)
    min: 200
    max: 800
    step: 50
    unit_of_measurement: µS/cm
    icon: "mdi:flask-outline"
    initial: 300
  riego_zona1_humedad_min_inicio:
    name: Humedad mín Z1 inicio ciclo
    min: 0
    max: 60
