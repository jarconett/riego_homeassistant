# Paquete de riego inteligente — dos zonas (2 válvulas / 2 circuitos)
#
# Instalación: copia a config/packages/ y añade en configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Notificaciones push: notify.mobile_app_pixel_9
#
# Entidades Mi Flora (mismo patrón en los 4 sensores):
#   sensor.jardin_{1-4}_{cherry|motto|tex|escu}_{humedad|temperatura|conductividad|iluminancia|bateria}
#
# Zona 1 (arriate / jardineras / huerto):
#   - Orquestador nocturno: riega si hace falta (como Zona 2).
#   - Refuerzo fijo: 2 min a las 07:00 y 19:00 (sin evaluar desbalance entre sensores).
# Zona 2 (rosales / tomates pera): orquestador nocturno al anochecer.

group:
  mi_flora_cherry:
    name: Mi Flora — Cherry (tomates)
    entities:
    - sensor.jardin_1_cherry_humedad
    - sensor.jardin_1_cherry_temperatura
    - sensor.jardin_1_cherry_conductividad
    - sensor.jardin_1_cherry_iluminancia
    - sensor.jardin_1_cherry_bateria
  mi_flora_motto:
    name: Mi Flora — Motto (pepinos)
    entities:
    - sensor.jardin_2_motto_humedad
    - sensor.jardin_2_motto_temperatura
    - sensor.jardin_2_motto_conductividad
    - sensor.jardin_2_motto_iluminancia
    - sensor.jardin_2_motto_bateria
  mi_flora_tex:
    name: Mi Flora — Tex (tomates pera)
    entities:
    - sensor.jardin_3_tex_humedad
    - sensor.jardin_3_tex_temperatura
    - sensor.jardin_3_tex_conductividad
    - sensor.jardin_3_tex_iluminancia
    - sensor.jardin_3_tex_bateria
  mi_flora_escu:
    name: Mi Flora — Escu (calabazas)
    entities:
    - sensor.jardin_4_escu_humedad
    - sensor.jardin_4_escu_temperatura
    - sensor.jardin_4_escu_conductividad
    - sensor.jardin_4_escu_iluminancia
    - sensor.jardin_4_escu_bateria
  mi_flora_todos:
    name: Mi Flora — Todos los sensores
    entities:
    - group.mi_flora_cherry
    - group.mi_flora_motto
    - group.mi_flora_tex
    - group.mi_flora_escu
input_number:
  riego_objetivo_cherry:
    name: Objetivo humedad Cherry
    min: 20
    max: 60
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:tomato"
    initial: 35
  riego_objetivo_motto:
    name: Objetivo humedad Pepinos
    min: 20
    max: 60
    step: 1
