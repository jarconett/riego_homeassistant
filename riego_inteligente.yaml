    step: 1
    unit_of_measurement: min
    icon: "mdi:timer-sand"
    initial: 15
  riego_pulso2_zona1_min:
    name: Pulso 2 Zona 1 (min)
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    icon: "mdi:timer"
    initial: 8
  riego_pulso2_zona2_min:
    name: Pulso 2 Zona 2 (min)
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    icon: "mdi:timer"
    initial: 5
  riego_pulso_suave_min:
    name: Pulso suave (min)
    min: 1
