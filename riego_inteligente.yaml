input_select:
  riego_zona1_etapa:
    name: Etapa riego Zona 1
    icon: "mdi:watering-can"
    options:
    - En espera
    - Iniciando
    - En espera — sensor no disponible
    - En espera — suelo caliente
    - En espera — encharque / EC baja
    - Ola de calor — riego nocturno
    - No necesario — suelo húmedo
    - Confirmando humedad
    - Pulso suave — regando
    - Pulso 1 — regando
    - Pausa absorción
    - Pulso 2 — refuerzo
    - Lectura final
