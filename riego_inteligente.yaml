template:
- sensor:
  - name: Riego Zona 1 desbalance
    unique_id: riego_zona1_desbalance
    default_entity_id: sensor.riego_zona_1_desbalance
    unit_of_measurement: "%"
    icon: "mdi:scale-balance"
    state: |
      {% set ns = namespace(vals=[]) %} {% set lista = [ 'sensor.jardin_1_cherry_humedad', 'sensor.jardin_2_motto_humedad', 'sensor.jardin_4_escu_humedad' ] %} {% for s in lista %} {% if not (is_state(s, 'unavailable') or is_state(s, 'unknown')) %} {% set ns.vals = ns.vals + [states(s) | float(0)] %} {% endif %} {% endfor %} {{ (ns.vals | max - ns.vals | min) | round(1) if ns.vals | length >= 2 else 0 }}
    attributes:
      mas_seco: |
        {% set ns = namespace(ok={}) %} {% set pares = [ ('Cherry', 'sensor.jardin_1_cherry_humedad'), ('Pepinos', 'sensor.jardin_2_motto_humedad'), ('Calabazas', 'sensor.jardin_4_escu_humedad') ] %} {% for nombre, s in pares %} {% if not (is_state(s, 'unavailable') or is_state(s, 'unknown')) %} {% set ns.ok = ns.ok | combine({nombre: states(s) | float(0)}) %} {% endif %} {% endfor %} {{ ns.ok | dictsort(false, 'value') | first | first if ns.ok | length > 0 else '—' }}
      mas_humedo: |
        {% set ns = namespace(ok={}) %} {% set pares = [ ('Cherry', 'sensor.jardin_1_cherry_humedad'), ('Pepinos', 'sensor.jardin_2_motto_humedad'), ('Calabazas', 'sensor.jardin_4_escu_humedad') ] %} {% for nombre, s in pares %} {% if not (is_state(s, 'unavailable') or is_state(s, 'unknown')) %} {% set ns.ok = ns.ok | combine({nombre: states(s) | float(0)}) %} {% endif %} {% endfor %} {{ ns.ok | dictsort(true, 'value') | first | first if ns.ok | length > 0 else '—' }}
  - name: Riego Zona 1 sensores OK
    unique_id: riego_zona1_sensores_ok
    default_entity_id: sensor.riego_zona_1_sensores_ok
    icon: "mdi:bluetooth"
    state: |
      {% set lista = [ 'sensor.jardin_1_cherry_humedad', 'sensor.jardin_2_motto_humedad', 'sensor.jardin_4_escu_humedad', 'sensor.jardin_1_cherry_temperatura', 'sensor.jardin_2_motto_temperatura', 'sensor.jardin_4_escu_temperatura' ] %} {% set ns = namespace(ok=true) %} {% for s in lista %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %} {% set ns.ok = false %} {% endif %} {% endfor %} {{ 'ok' if ns.ok else 'fallo' }}
    attributes:
      fallidos: |
        {% set lista = [ ('Cherry humedad', 'sensor.jardin_1_cherry_humedad'), ('Pepinos humedad', 'sensor.jardin_2_motto_humedad'), ('Calabazas humedad', 'sensor.jardin_4_escu_humedad'), ('Cherry temp', 'sensor.jardin_1_cherry_temperatura'), ('Pepinos temp', 'sensor.jardin_2_motto_temperatura'), ('Calabazas temp', 'sensor.jardin_4_escu_temperatura') ] %} {% set ns = namespace(out=[]) %} {% for nombre, s in lista %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %} {% set ns.out = ns.out + [nombre] %} {% endif %} {% endfor %} {{ ns.out | join(', ') }}
  - name: Riego Zona 2 sensores OK
    unique_id: riego_zona2_sensores_ok
    default_entity_id: sensor.riego_zona_2_sensores_ok
    icon: "mdi:bluetooth"
    state: |
      {% set lista = [ 'sensor.jardin_3_tex_humedad', 'sensor.jardin_3_tex_temperatura' ] %} {% set ns = namespace(ok=true) %} {% for s in lista %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %} {% set ns.ok = false %} {% endif %} {% endfor %} {{ 'ok' if ns.ok else 'fallo' }}
    attributes:
      fallidos: |
        {% set lista = [ ('Tex humedad', 'sensor.jardin_3_tex_humedad'), ('Tex temp', 'sensor.jardin_3_tex_temperatura') ] %} {% set ns = namespace(out=[]) %} {% for nombre, s in lista %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %} {% set ns.out = ns.out + [nombre] %} {% endif %} {% endfor %} {{ ns.out | join(', ') }}
  - name: Riego Cherry desfase
    unique_id: riego_cherry_desfase
    default_entity_id: sensor.riego_cherry_desfase
    unit_of_measurement: pts
    icon: "mdi:tomato"
    state: |
      {% set s = 'sensor.jardin_1_cherry_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}unknown {% else %} {{ (states('input_number.riego_objetivo_cherry') | float(35) - states(s) | float(0)) | round(1) }} {% endif %}
    attributes:
      humedad: "{{ states('sensor.jardin_1_cherry_humedad') }}"
      objetivo: "{{ states('input_number.riego_objetivo_cherry') }}"
      nivel: |
        {% set s = 'sensor.jardin_1_cherry_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}desconocido {% else %} {% set d = states('input_number.riego_objetivo_cherry') | float(35) - states(s) | float(0) %} {% if d >= states('input_number.riego_umbral_desfase_grave') | float(15) %}grave {% elif d >= states('input_number.riego_umbral_desfase_moderado') | float(8) %}moderado {% elif d > 0 %}leve {% else %}ok{% endif %} {% endif %}
  - name: Riego Motto desfase
    unique_id: riego_motto_desfase
    default_entity_id: sensor.riego_motto_desfase
    unit_of_measurement: pts
    icon: "mdi:food-cucumber"
    state: |
      {% set s = 'sensor.jardin_2_motto_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}unknown {% else %} {{ (states('input_number.riego_objetivo_motto') | float(42) - states(s) | float(0)) | round(1) }} {% endif %}
    attributes:
      humedad: "{{ states('sensor.jardin_2_motto_humedad') }}"
      objetivo: "{{ states('input_number.riego_objetivo_motto') }}"
      nivel: |
        {% set s = 'sensor.jardin_2_motto_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}desconocido {% else %} {% set d = states('input_number.riego_objetivo_motto') | float(42) - states(s) | float(0) %} {% if d >= states('input_number.riego_umbral_desfase_grave') | float(15) %}grave {% elif d >= states('input_number.riego_umbral_desfase_moderado') | float(8) %}moderado {% elif d > 0 %}leve {% else %}ok{% endif %} {% endif %}
  - name: Riego Escu desfase
    unique_id: riego_escu_desfase
    default_entity_id: sensor.riego_escu_desfase
    unit_of_measurement: pts
    icon: "mdi:pumpkin"
    state: |
      {% set s = 'sensor.jardin_4_escu_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}unknown {% else %} {{ (states('input_number.riego_objetivo_escu') | float(32) - states(s) | float(0)) | round(1) }} {% endif %}
    attributes:
      humedad: "{{ states('sensor.jardin_4_escu_humedad') }}"
      objetivo: "{{ states('input_number.riego_objetivo_escu') }}"
      nivel: |
        {% set s = 'sensor.jardin_4_escu_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}desconocido {% else %} {% set d = states('input_number.riego_objetivo_escu') | float(32) - states(s) | float(0) %} {% if d >= states('input_number.riego_umbral_desfase_grave') | float(15) %}grave {% elif d >= states('input_number.riego_umbral_desfase_moderado') | float(8) %}moderado {% elif d > 0 %}leve {% else %}ok{% endif %} {% endif %}
  - name: Riego Tex desfase
    unique_id: riego_tex_desfase
    default_entity_id: sensor.riego_tex_desfase
    unit_of_measurement: pts
    icon: "mdi:tomato"
    state: |
      {% set s = 'sensor.jardin_3_tex_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}unknown {% else %} {{ (states('input_number.riego_objetivo_tex') | float(35) - states(s) | float(0)) | round(1) }} {% endif %}
    attributes:
      humedad: "{{ states('sensor.jardin_3_tex_humedad') }}"
      objetivo: "{{ states('input_number.riego_objetivo_tex') }}"
      nivel: |
        {% set s = 'sensor.jardin_3_tex_humedad' %} {% if is_state(s, 'unavailable') or is_state(s, 'unknown') %}desconocido {% else %} {% set d = states('input_number.riego_objetivo_tex') | float(35) - states(s) | float(0) %} {% if d >= states('input_number.riego_umbral_desfase_grave') | float(15) %}grave {% elif d >= states('input_number.riego_umbral_desfase_moderado') | float(8) %}moderado {% elif d > 0 %}leve {% else %}ok{% endif %} {% endif %}
  - name: Riego Zona 1 temp suelo max
    unique_id: riego_zona1_temp_suelo_max
    default_entity_id: sensor.riego_zona_1_temp_suelo_max
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    state: |
      {{ [ states('sensor.jardin_1_cherry_temperatura') | float(0), states('sensor.jardin_2_motto_temperatura') | float(0), states('sensor.jardin_4_escu_temperatura') | float(0) ] | max | round(1) }}
    attributes:
