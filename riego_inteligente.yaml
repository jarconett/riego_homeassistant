  riego_zona2_etapa:
    name: Etapa riego Zona 2
    icon: "mdi:watering-can"
    options:
    - En espera
    - Iniciando
    - En espera — sensor no disponible
    - En espera — suelo caliente
    - En espera — encharque / EC baja
    - Ola de calor — riego nocturno
    - No necesario — suelo húmedo
    - Confirmando humedad
    - Pulso suave — regando
    - Pulso 1 — regando
